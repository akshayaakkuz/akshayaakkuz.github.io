<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal / Security lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e6eef4;background:#0d1722;color-scheme:dark}body{max-width:960px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #314251;padding-bottom:20px}.brand{font-size:26px;font-weight:750;color:#63dec1}main{padding:40px 0}h1{font-size:clamp(28px,5vw,46px);letter-spacing:-1px;line-height:1.1}.eyebrow{color:#63dec1;text-transform:uppercase;letter-spacing:2px;font-size:12px}.card{background:#172534;border:1px solid #314251;border-radius:16px;padding:24px;margin:24px 0}.muted,footer{color:#aabccc;line-height:1.7}a{color:#82e6d0}button{background:#63dec1;color:#08261f;border:0;border-radius:8px;padding:12px 20px;font:inherit;font-weight:650;cursor:pointer}input,textarea{box-sizing:border-box;width:100%;background:#0d1722;color:#e6eef4;border:1px solid #587084;border-radius:8px;padding:12px;font:inherit;margin-top:8px}label{font-weight:600}.errorlist{color:#ffb6b6}li{margin:12px 0}.score{font-size:52px;font-weight:700;color:#63dec1}.history{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #314251;padding:16px 0}footer{border-top:1px solid #314251;padding-top:20px;font-size:13px}
</style></head><body><header><a class="brand" href="/">Signal.</a><span>Security lab · Python edition</span>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main><footer>Personal learning project. Synthetic messages only. Scores are heuristic points, not probabilities or proof of safety.</footer></body></html>
