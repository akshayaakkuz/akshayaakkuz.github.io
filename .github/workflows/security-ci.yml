name: Signal security CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install application and security tools
        run: python -m pip install -r secure-signal/requirements.txt bandit==1.9.4 pip-audit==2.10.1
      - name: Existing browser detector tests
        run: node spam-check/test.cjs
      - name: Framework and migration checks
        run: |
          python secure-signal/manage.py check
          python secure-signal/manage.py makemigrations --check --dry-run
      - name: Application and security regression tests
        run: python secure-signal/manage.py test scans --verbosity 2
      - name: Prove ownership regressions are detected
        run: python secure-signal/scripts/verify_regression.py
      - name: Static security analysis
        run: python -m bandit -r secure-signal/config secure-signal/scans -x tests.py
      - name: Known dependency vulnerabilities (fail closed)
        run: python -m pip_audit -r secure-signal/requirements.txt --no-deps --disable-pip
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build only after verification passes
        run: docker build -t signal-lab secure-signal
      - name: Test the packaged application
        run: docker run --rm signal-lab python manage.py test scans
      - name: Smoke-test the running container
        run: |
          docker run -d --name signal-smoke -p 127.0.0.1:8000:8000 signal-lab
          trap 'docker rm -f signal-smoke' EXIT
          docker exec signal-smoke python manage.py migrate --noinput
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/login/ > /dev/null
